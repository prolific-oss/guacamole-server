name: Build and push guacenc image

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: guacenc-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY_HOST: us-east1-docker.pkg.dev
  REGISTRY_REPOSITORY: prolific-infra-mgmt/desktop-trajectory-capture
  IMAGE_NAME: guacenc
  GCP_SERVICE_ACCOUNT: ci-github-nonprod@prolific-infra-mgmt.iam.gserviceaccount.com
  WORKLOAD_IDENTITY_PROVIDER: projects/274607699786/locations/global/workloadIdentityPools/github-actions/providers/github-actions-prvdr

permissions:
  contents: read
  id-token: write

jobs:
  meta:
    name: Compute image tags
    runs-on: ubuntu-latest
    outputs:
      image_id: ${{ steps.set-image-id.outputs.image_id }}
      image_ref: ${{ steps.set-image-id.outputs.image_ref }}
      is_main: ${{ steps.set-image-id.outputs.is_main }}
    steps:
      - uses: actions/checkout@v4

      - name: Generate Image ID
        id: set-image-id
        run: |
          SHORT_SHA=$(git rev-parse --short=7 HEAD)
          IMAGE_BASE="${{ env.REGISTRY_HOST }}/${{ env.REGISTRY_REPOSITORY }}/${{ env.IMAGE_NAME }}"

          if [[ "${{ github.ref }}" == "refs/heads/main" ]]; then
            IMAGE_ID="$(date +%Y.%m.%d).${GITHUB_RUN_NUMBER}.${SHORT_SHA}"
            IS_MAIN=true
          elif [[ -n "${{ github.head_ref }}" ]]; then
            BRANCH_NAME="${{ github.head_ref }}"
            IMAGE_ID="${BRANCH_NAME//\//-}-${SHORT_SHA}"
            IS_MAIN=false
          else
            BRANCH_NAME="${GITHUB_REF#refs/heads/}"
            IMAGE_ID="${BRANCH_NAME//\//-}-${SHORT_SHA}"
            IS_MAIN=false
          fi

          echo "image_id=${IMAGE_ID}" >> "$GITHUB_OUTPUT"
          echo "image_ref=${IMAGE_BASE}:${IMAGE_ID}" >> "$GITHUB_OUTPUT"
          echo "is_main=${IS_MAIN}" >> "$GITHUB_OUTPUT"
          echo "IMAGE_ID=${IMAGE_ID}"
          echo "IMAGE_REF=${IMAGE_BASE}:${IMAGE_ID}"

  build:
    name: Build ${{ matrix.platform }}
    needs: [meta]
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: true
      matrix:
        include:
          - runner: ubuntu-latest
            platform: linux/amd64
            arch: amd64
          - runner: ubuntu-24.04-arm
            platform: linux/arm64
            arch: arm64
    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to GCP
        id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ env.GCP_SERVICE_ACCOUNT }}
          token_format: access_token

      - name: Login to Artifact Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY_HOST }}
          username: oauth2accesstoken
          password: ${{ steps.auth.outputs.access_token }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: guacenc/Dockerfile
          platforms: ${{ matrix.platform }}
          push: true
          outputs: type=image,push-by-digest=true,name-canonical=true,push=true
          build-args: |
            IMAGE_ID=${{ needs.meta.outputs.image_id }}
          tags: ${{ env.REGISTRY_HOST }}/${{ env.REGISTRY_REPOSITORY }}/${{ env.IMAGE_NAME }}

      - name: Export digest
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@v4
        with:
          name: digests-${{ matrix.arch }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    name: Merge multi-arch manifest
    needs: [meta, build]
    runs-on: ubuntu-latest
    steps:
      - name: Download digests
        uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: digests-*
          merge-multiple: true

      - name: Authenticate to GCP
        id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ env.GCP_SERVICE_ACCOUNT }}
          token_format: access_token

      - name: Login to Artifact Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY_HOST }}
          username: oauth2accesstoken
          password: ${{ steps.auth.outputs.access_token }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Create manifest and push tags
        env:
          IMAGE_REF: ${{ needs.meta.outputs.image_ref }}
          IMAGE_BASE: ${{ env.REGISTRY_HOST }}/${{ env.REGISTRY_REPOSITORY }}/${{ env.IMAGE_NAME }}
          IS_MAIN: ${{ needs.meta.outputs.is_main }}
        run: |
          set -euo pipefail
          cd /tmp/digests
          digests=()
          for digest_file in *; do
            digests+=("${IMAGE_BASE}@sha256:${digest_file}")
          done

          echo "Creating manifest for ${IMAGE_REF} from: ${digests[*]}"
          docker buildx imagetools create -t "${IMAGE_REF}" "${digests[@]}"

          if [[ "${IS_MAIN}" == "true" ]]; then
            echo "Also tagging ${IMAGE_BASE}:latest"
            docker buildx imagetools create -t "${IMAGE_BASE}:latest" "${digests[@]}"
          fi

          docker buildx imagetools inspect "${IMAGE_REF}"
